# Render Blueprint — https://render.com/docs/blueprint-spec
#
# This deploys the app as-is for a soft/staging test: SQLite on Render's
# ephemeral disk (data does not survive a redeploy), and payment/email
# credentials left unset so they use the safe fallbacks already built into
# settings.py (graceful payment failure, console-backend email). Move to
# Postgres and add real credentials before treating this as a real launch —
# see DATABASE_URL and the SUPABASE_S3_* / RAZORPAY_* / EMAIL_* vars below.
services:
  - type: web
    name: ishas-return-gifts
    runtime: python
    plan: starter
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate"
    startCommand: "gunicorn isha_return_gifts.wsgi -c gunicorn.conf.py"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: PYTHON_VERSION
        value: "3.11.7"
      # ALLOWED_HOSTS/CSRF_TRUSTED_ORIGINS: not set here — settings.py adds
      # Render's own RENDER_EXTERNAL_HOSTNAME automatically. Add your custom
      # domain to both, comma-separated, once you attach one.
      # DATABASE_URL: unset -> SQLite. Set to your Supabase direct connection
      # string to move off ephemeral storage.
      # RAZORPAY_KEY_ID / RAZORPAY_KEY_SECRET: unset -> online payment fails
      # gracefully with a message; COD still works.
      # EMAIL_HOST_USER / EMAIL_HOST_PASSWORD / ADMIN_EMAIL: unset -> mail
      # "sends" to the log instead of a real inbox.
      # SUPABASE_S3_ENDPOINT / _ACCESS_KEY / _SECRET_KEY: unset -> product
      # images use local disk (also ephemeral on Render without a persistent
      # disk attached).

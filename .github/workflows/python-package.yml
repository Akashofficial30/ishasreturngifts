# Runs the Django test suite and a syntax-error lint pass.
# See: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Django CI

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  test:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Django 5.0 requires Python 3.10+. 3.11 matches .python-version.
        python-version: ["3.11", "3.12"]

    env:
      # settings.py has no fallback for SECRET_KEY by design, so CI must supply
      # one. This value is used only to run the tests.
      SECRET_KEY: ci-only-key-not-used-anywhere-else
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      SECURE_SSL_REDIRECT: "False"

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install flake8
        pip install -r requirements.txt

    - name: Lint for syntax errors and undefined names
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Check for missing migrations
      run: python manage.py makemigrations --check --dry-run

    - name: Run tests
      run: python manage.py test

{% extends 'base.html' %}

{% block title %}Payment Failed – Isha Return Gifts{% endblock %}

{% block content %}
<section class="confirmation-section">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-6">
                <div class="confirmation-card text-center">
                    <div class="fail-icon">
                        <i class="fas fa-times-circle"></i>
                    </div>
                    <h2>Payment Failed</h2>
                    <p class="text-muted">We couldn't process your payment. Your cart items are still saved.</p>
                    <div class="confirmation-actions mt-4">
                        <a href="{% url 'cart' %}" class="btn-primary-gold">Try Again</a>
                        <a href="{% url 'home' %}" class="btn-outline-gold ms-3">Go Home</a>
                    </div>
                    <p class="mt-3 small text-muted">Need help? Call us at +91 98765 43210</p>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}

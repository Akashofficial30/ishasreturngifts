{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Admin Login — Isha's Return Gifts</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;background:#0c0c10;min-height:100vh;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;}
body::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 15% 50%,rgba(192,57,43,0.12) 0%,transparent 55%),radial-gradient(ellipse at 85% 20%,rgba(212,168,67,0.07) 0%,transparent 50%);}
.card{position:relative;z-index:1;background:#13131a;border:1px solid rgba(255,255,255,0.06);border-radius:18px;padding:44px 40px;width:100%;max-width:400px;box-shadow:0 24px 80px rgba(0,0,0,0.7);}
.logo{text-align:center;margin-bottom:32px;}
.logo-icon{width:56px;height:56px;border-radius:14px;background:linear-gradient(135deg,#d4a843,#c0392b);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800;color:white;margin:0 auto 14px;}
.logo h1{font-size:20px;font-weight:800;color:#f0f0f8;margin-bottom:4px;}
.logo p{font-size:12px;color:#606078;letter-spacing:1px;text-transform:uppercase;}
.f-group{margin-bottom:16px;}
.f-label{display:block;font-size:11px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:#606078;margin-bottom:7px;}
.input-wrap{position:relative;}
.input-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:#606078;font-size:13px;}
.f-control{width:100%;padding:11px 14px 11px 40px;background:#1a1a24;border:1px solid rgba(255,255,255,0.06);border-radius:8px;color:#f0f0f8;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;font-size:13px;outline:none;transition:all 0.2s;}
.f-control:focus{border-color:#d4a843;box-shadow:0 0 0 3px rgba(212,168,67,0.12);}
.btn-login{width:100%;padding:13px;background:linear-gradient(135deg,#d4a843,#b8892a);color:white;border:none;border-radius:8px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;font-size:13.5px;font-weight:700;cursor:pointer;transition:all 0.2s;margin-top:6px;}
.btn-login:hover{opacity:0.85;transform:translateY(-1px);box-shadow:0 8px 24px rgba(212,168,67,0.3);}
.err{background:rgba(192,57,43,0.1);border:1px solid rgba(192,57,43,0.3);color:#fca5a5;padding:11px 14px;border-radius:8px;font-size:12.5px;margin-bottom:16px;display:flex;align-items:center;gap:8px;}
.footer{text-align:center;margin-top:20px;font-size:12px;color:#404058;}
.footer a{color:#d4a843;text-decoration:none;}
.icon{width:1em;height:1em;fill:currentColor;vertical-align:-.125em;flex-shrink:0;}
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <div class="logo-icon">I</div>
    <h1>Isha's Return Gifts</h1>
    <p>Admin Dashboard</p>
  </div>
  {% if messages %}{% for m in messages %}<div class="err"><svg class="icon" aria-hidden="true"><use href="{% static 'icons/sprite.svg' %}#i-exclamation-circle"></use></svg>{{ m }}</div>{% endfor %}{% endif %}
  <form method="POST">
    {% csrf_token %}
    <div class="f-group">
      <label class="f-label">Username</label>
      <div class="input-wrap"><svg class="icon input-icon" aria-hidden="true"><use href="{% static 'icons/sprite.svg' %}#i-user"></use></svg><input type="text" name="username" class="f-control" placeholder="Enter username" required autofocus></div>
    </div>
    <div class="f-group">
      <label class="f-label">Password</label>
      <div class="input-wrap"><svg class="icon input-icon" aria-hidden="true"><use href="{% static 'icons/sprite.svg' %}#i-lock"></use></svg><input type="password" name="password" class="f-control" placeholder="Enter password" required></div>
    </div>
    <button type="submit" class="btn-login"><svg class="icon" aria-hidden="true" style="margin-right:8px;"><use href="{% static 'icons/sprite.svg' %}#i-sign-in-alt"></use></svg>Sign In to Dashboard</button>
  </form>
  <div class="footer"><a href="{% url 'home' %}">← Back to Website</a></div>
</div>
</body>
</html>
